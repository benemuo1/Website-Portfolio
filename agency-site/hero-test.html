<!--
  BEMONIX — landing page hero A/B TEST VARIANT (hero-test.html)
  ================================================================
  NOT linked from nav — this is a standalone comparison page, a full copy
  of index.html with the 3D "corridor" carousel removed and replaced with
  a single centered, static cube logo. Everything else (nav, hero text,
  buttons, footer, responsive behavior) is identical to index.html — see
  that file's header comment for the full explanation of the color system
  and page structure this shares.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEMONIX — Hero Test</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Inter:wght@200;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* See index.html's file-header comment for what each variable controls. */
:root{--accent:#761941;--bg:#fff7e2;--surface:#ffffff;--muted:rgba(76,16,42,.55);--text:#4c102a;--gold:#c9a227}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column}

nav{position:fixed;top:0;width:100%;height:90px;padding:0 3rem;display:flex;justify-content:space-between;align-items:center;z-index:200;background:rgba(255,247,226,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--surface)}
nav .logo{display:block;height:150px;width:auto;flex-shrink:0}
nav > ul{display:flex;align-items:center;gap:2.5rem;list-style:none}
nav a{color:var(--text);text-decoration:none;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
nav .nav-cta{padding:.5rem 1.5rem;border:1px solid rgba(76,16,42,.3);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--text);transition:border-color .3s,color .3s}
nav .nav-cta:hover{background:var(--accent);border-color:var(--gold);color:var(--gold)}
nav .nav-dropdown{position:relative;display:flex;align-items:center;height:90px}
nav .nav-dropdown > a::after{content:'';display:inline-block;margin-left:.4em;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;vertical-align:middle;opacity:.6}
nav .nav-dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-6px);display:flex;flex-direction:column;gap:.15rem;min-width:170px;list-style:none;background:rgba(255,247,226,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--surface);border-radius:.6rem;padding:.5rem;box-shadow:0 20px 45px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
nav .nav-dropdown:hover .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
nav .nav-dropdown-menu a{display:block;padding:.65rem .9rem;border-radius:.35rem;white-space:nowrap}
nav .nav-dropdown-menu a:hover{background:rgba(201,162,39,.1);color:var(--gold)}

.nav-actions{display:flex;align-items:center;gap:1rem}
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.nav-toggle span{display:block;width:100%;height:2px;background:var(--text);transition:transform .3s,opacity .3s}
nav.nav-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
nav.nav-open .nav-toggle span:nth-child(2){opacity:0}
nav.nav-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

@media(max-width:1150px) and (min-width:901px){
  nav{padding:0 1.75rem}
  nav .logo{height:110px}
  nav > ul{gap:1.5rem}
  nav a{font-size:.62rem}
  nav .nav-cta{padding:.4rem 1.1rem;font-size:.6rem}
}

@media(max-width:900px){
  nav{padding:0 1.5rem}
  nav .logo{height:100px}
  .nav-toggle{display:flex}
  nav > ul{display:none;position:absolute;top:90px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:rgba(255,247,226,.98);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--surface);padding:.5rem 1.5rem 1.5rem;box-shadow:0 20px 40px rgba(0,0,0,.15);max-height:calc(100vh - 90px);overflow-y:auto}
  nav.nav-open > ul{display:flex}
  nav > ul > li{width:100%}
  nav > ul > li > a{display:block;padding:.9rem 0;border-bottom:1px solid rgba(76,16,42,.08)}
  nav .nav-dropdown{height:auto;display:block;position:static}
  nav .nav-dropdown > a::after{display:none}
  nav .nav-dropdown-menu{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:none;padding:0 0 .5rem 1rem;gap:0;min-width:0}
  nav .nav-dropdown-menu a{padding:.7rem 0;border-bottom:none;font-size:.65rem;color:var(--muted)}
  nav .nav-cta{padding:.45rem 1rem;font-size:.6rem}
}

/* MOBILE — same "drop the one-viewport constraint" treatment as index.html. */
@media(max-width:640px){
  html,body{height:auto;overflow:visible}
  .hero{flex:none;min-height:100vh;min-height:100dvh}
  .hero-content{height:auto;min-height:100vh;min-height:100dvh;padding:7rem 1.25rem 3rem}
  .hero-content h1{white-space:normal;font-size:clamp(1.7rem,8vw,2.6rem);line-height:1.2}
  .hero-cta{flex-wrap:wrap;justify-content:center}
  .hero-logo{width:clamp(260px,88vw,420px)}
}

/* HERO — no corridor here. Just the cube logo, centered, static. */
.hero{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-logo-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none}
/* Video is 1280x720 but the cube+wordmark art only fills a centered 895x246 band —
   crop to that band's aspect ratio with object-fit:cover so it isn't tiny and letterboxed. */
.hero-logo{width:clamp(480px,60vw,920px);aspect-ratio:1280/420;object-fit:cover;object-position:center;opacity:.95;-webkit-mask-image:radial-gradient(ellipse 62% 68% at center,#000 45%,transparent 78%);mask-image:radial-gradient(ellipse 62% 68% at center,#000 45%,transparent 78%)}
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center 55%,rgba(255,247,226,0) 60%,rgba(255,247,226,.22) 100%);z-index:2;pointer-events:none}
.hero-content{position:relative;z-index:3;text-align:center;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:7rem 2rem .35rem}
.hero-content h1{font-family:'Jost',sans-serif;font-weight:600;font-size:clamp(1.8rem,4.2vw,3.8rem);line-height:1;letter-spacing:.08em;white-space:nowrap;opacity:0}
.hero-content h1 .accent{color:var(--accent)}
.hero-content p{font-size:.9rem;color:rgba(76,16,42,.75);letter-spacing:.2em;text-transform:uppercase;font-weight:200;opacity:0}
.hero-bar{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);width:200px;margin:.8rem auto 0;transform:scaleX(0)}
.hero-cta{display:flex;gap:1.2rem;justify-content:center;margin-top:2rem}
.hero-cta a{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:.9rem 2rem;border-radius:2px;transition:all .3s;opacity:0}
.hero-cta .btn-primary{background:var(--accent);color:var(--bg);border:1px solid var(--accent)}
.hero-cta .btn-primary:hover{background:var(--accent);border-color:var(--gold);color:var(--gold)}
.hero-cta .btn-secondary{color:var(--text);border:1px solid rgba(76,16,42,.3)}
.hero-cta .btn-secondary:hover{background:var(--accent);border-color:var(--gold);color:var(--gold)}

footer{padding:1.2rem 3rem;border-top:1px solid var(--surface);text-align:center;font-size:.6rem;color:var(--muted);letter-spacing:.2em;flex-shrink:0}
</style>
</head>
<body>

<nav>
  <a href="index.html"><img class="logo" src="../Screenshots/bemonix-logo-transparent.png" alt="Bemonix"></a>
  <ul>
    <li class="nav-dropdown">
      <a href="showcase.html">Work</a>
      <ul class="nav-dropdown-menu">
        <li><a href="featured.html">Featured Work</a></li>
        <li><a href="showcase.html">All Work</a></li>
      </ul>
    </li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <a href="contact.html" class="nav-cta">Start a Project</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="hero">
  <div class="hero-logo-wrap">
    <video class="hero-logo" autoplay muted playsinline preload="auto">
      <source src="../Screenshots/Cube_rolls_and_transforms_logo_202608310130.mp4" type="video/mp4">
    </video>
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1><span class="accent">Digital</span> Solutions<span class="accent"> Built to</span> Perform</h1>
    <div class="hero-bottom">
      <p>Every website you see here was built by us and yours can be next</p>
      <div class="hero-bar"></div>
      <div class="hero-cta">
        <a href="contact.html" class="btn-primary">Start a Project</a>
        <a href="showcase.html" class="btn-secondary">View Our Work</a>
      </div>
    </div>
  </div>
</section>

<footer>© 2026 BEMONIX · HOUSTON, TX · REMOTE WORLDWIDE</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ── MOBILE NAV TOGGLE ────────────────────────────────────────────────────────
(function initNavToggle() {
  const nav = document.querySelector('nav');
  const toggle = document.getElementById('navToggle');
  if (!nav || !toggle) return;
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('nav-open');
    toggle.setAttribute('aria-expanded', open);
  });
  nav.querySelectorAll('ul a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('nav-open');
    toggle.setAttribute('aria-expanded', 'false');
  }));
})();

// ── HERO ENTRANCE ─────────────────────────────────────────────────────────────
gsap.fromTo('.hero-content h1', {y:60, opacity:0}, {y:0, opacity:1, duration:1.5, delay:.4, ease:'power3.out'});
gsap.fromTo('.hero-content p',  {y:20, opacity:0}, {y:0, opacity:1, duration:.8,  delay:1});
gsap.fromTo('.hero-bar',        {scaleX:0},        {scaleX:1, duration:1, delay:1.3});
gsap.fromTo('.hero-cta a',      {y:20, opacity:0}, {y:0, opacity:1, stagger:.12, duration:.7, delay:1.6});
</script>
</body>
</html>
