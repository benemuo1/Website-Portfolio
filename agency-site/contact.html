<!--
  BEMONIX — Contact page (contact.html)
  =======================================
  One section: closing CTA with two direct contact links. No scroll-driven
  effects here beyond a simple entrance animation (see <script> below).

  Part of a multi-page site: index.html (hero landing page) / showcase.html
  (full 44-template work grid) / featured.html / about.html / services.html
  / contact.html (this page). All six share the same nav, footer, and
  5-variable color system defined in :root below — see index.html's file
  header for the full explanation of what each variable controls. Keep the
  :root line identical across all six files if you change the palette.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEMONIX — Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Inter:wght@200;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#761941;--bg:#fff7e2;--surface:#ffffff;--muted:rgba(76,16,42,.55);--text:#4c102a;--gold:#c9a227}
/* html/body locked to exactly one viewport tall (no scroll) — this page is
   a single section + footer meant to fit entirely on screen. .contact
   below flexes to fill whatever's left after the footer's natural height. */
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column}

nav{position:fixed;top:0;width:100%;height:90px;padding:0 3rem;display:flex;justify-content:space-between;align-items:center;z-index:200;background:rgba(255,247,226,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px dashed rgba(201,162,39,.35)}
nav .logo{display:block;height:150px;width:auto;flex-shrink:0}
nav > ul{display:flex;align-items:center;gap:2.5rem;list-style:none}
nav a{color:var(--text);text-decoration:none;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
nav .nav-cta{padding:.5rem 1.5rem;border:1px solid rgba(76,16,42,.3);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--text);transition:border-color .3s,color .3s}
nav .nav-cta:hover{background:var(--accent) repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 2px,transparent 2px 6px);border-color:var(--gold);color:var(--gold)}
/* "Work" nav dropdown — .nav-dropdown is given the nav's own 90px height so
   its hover area spans down to exactly where the menu appears (top:100%),
   with no gap a slow-moving cursor could fall through and drop the :hover. */
nav .nav-dropdown{position:relative;display:flex;align-items:center;height:90px}
nav .nav-dropdown > a::after{content:'';display:inline-block;margin-left:.4em;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;vertical-align:middle;opacity:.6}
nav .nav-dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-6px);display:flex;flex-direction:column;gap:.15rem;min-width:170px;list-style:none;background:rgba(255,247,226,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--surface);border-radius:.6rem;padding:.5rem;box-shadow:0 20px 45px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
nav .nav-dropdown:hover .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
nav .nav-dropdown-menu a{display:block;padding:.65rem .9rem;border-radius:.35rem;white-space:nowrap}
nav .nav-dropdown-menu a:hover{background:rgba(201,162,39,.1);color:var(--gold)}

/* NAV — RESPONSIVE. Three tiers, from the widest down:
     >1150px       desktop — the rules above, untouched.
     901-1150px    "smaller monitors": same full inline layout, just
                   shrunk (tighter gaps/type/logo) — there's still room
                   for the whole menu, it's just tight.
     <=900px       tablets and phones: nav > ul collapses behind the
                   hamburger toggle below; .nav-cta stays visible next to
                   it since it's the primary action.
   The hamburger doesn't duplicate any markup — .nav-open (toggled on
   <nav> by the JS at the bottom of <body>) just re-shows/restyles the
   SAME <ul> as a full-width dropdown panel, and the "Work" submenu
   becomes permanently inline there instead of hover-triggered, since
   touch has no hover. .nav-actions wraps .nav-cta + the toggle together
   so they sit as one group on the right once <ul> stops taking up space
   in the middle — see the HTML. */
.nav-actions{display:flex;align-items:center;gap:1rem}
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.nav-toggle span{display:block;width:100%;height:2px;background:var(--text);transition:transform .3s,opacity .3s}
nav.nav-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
nav.nav-open .nav-toggle span:nth-child(2){opacity:0}
nav.nav-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

@media(max-width:1150px) and (min-width:901px){
  nav{padding:0 1.75rem}
  nav .logo{height:110px}
  nav > ul{gap:1.5rem}
  nav a{font-size:.62rem}
  nav .nav-cta{padding:.4rem 1.1rem;font-size:.6rem}
}

@media(max-width:900px){
  nav{padding:0 1.5rem}
  nav .logo{height:100px}
  .nav-toggle{display:flex}
  nav > ul{display:none;position:absolute;top:90px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:rgba(255,247,226,.98);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px dashed rgba(201,162,39,.35);padding:.5rem 1.5rem 1.5rem;box-shadow:0 20px 40px rgba(0,0,0,.15);max-height:calc(100vh - 90px);overflow-y:auto}
  nav.nav-open > ul{display:flex}
  nav > ul > li{width:100%}
  nav > ul > li > a{display:block;padding:.9rem 0;border-bottom:1px solid rgba(76,16,42,.08)}
  nav .nav-dropdown{height:auto;display:block;position:static}
  nav .nav-dropdown > a::after{display:none}
  nav .nav-dropdown-menu{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:none;padding:0 0 .5rem 1rem;gap:0;min-width:0}
  nav .nav-dropdown-menu a{padding:.7rem 0;border-bottom:none;font-size:.65rem;color:var(--muted)}
  nav .nav-cta{padding:.45rem 1rem;font-size:.6rem}
}

/* CONTACT — dark section, same treatment as Featured/Services (see the
   "Alternating section backgrounds" comment in index.html's file header)
   with locally-redefined --surface/--text/--muted/--accent custom
   properties for this subtree. */
.contact{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px 3rem 1.5rem;background:#761941;--surface:rgba(255,247,226,.25);--text:#fff7e2;--muted:rgba(255,247,226,.65);--accent:#ffe9af} /* top padding clears the fixed nav — see the matching comment on featured.html's .h-section for why it's 140px, not just the nav's own 90px. flex:1/min-height:0 (instead of min-height:100vh) makes this fill whatever's left of the viewport after the footer, so the page fits on one screen with no scroll */
.contact h2{font-family:'Jost',sans-serif;font-weight:600;font-size:clamp(2.4rem,min(8vw,13vh),6rem);letter-spacing:.05em;color:var(--text)} /* capped by vh as well as vw — a pure vw cap can still be too tall for a short window on this no-scroll page */
.contact h2 .accent{color:var(--accent)}
.contact p{color:var(--muted);font-size:.85rem;margin-top:1.2rem;font-weight:200}
.contact-links{display:flex;gap:2rem;justify-content:center;margin-top:2rem}
.contact-links a{color:var(--text);text-decoration:none;font-size:.75rem;letter-spacing:.2em;border-bottom:1px dashed rgba(201,162,39,.35);padding-bottom:.3rem;transition:border-color .3s,color .3s}
.contact-links a:hover{border-color:var(--gold);color:var(--gold)}

footer{padding:1.2rem 3rem;border-top:1px dashed rgba(201,162,39,.35);text-align:center;font-size:.6rem;color:var(--muted);letter-spacing:.2em;flex-shrink:0}

/* MOBILE — this page is normally locked to exactly one screen with no
   scroll (see html,body above); the large heading + tagline + links can
   need more room than a short phone viewport has at a readable size, so
   below this breakpoint the constraint is dropped and the section
   becomes a normal, natural-height, scrollable block instead. */
@media(max-width:640px){
  html,body{height:auto;overflow:visible}
  .contact{flex:none;min-height:100vh;min-height:100dvh;padding:110px 1.5rem 2.5rem}
  .contact-links{flex-direction:column;gap:1.2rem}
}
</style>
</head>
<body>

<nav>
  <a href="index.html"><img class="logo" src="../Screenshots/bemonix-logo-transparent.png" alt="Bemonix"></a>
  <ul>
    <li class="nav-dropdown">
      <a href="showcase.html">Work</a>
      <ul class="nav-dropdown-menu">
        <li><a href="featured.html">Featured Work</a></li>
        <li><a href="showcase.html">All Work</a></li>
      </ul>
    </li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <a href="contact.html" class="nav-cta">Start a Project</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="contact" id="contact">
  <h2>LET'S TELL<br>YOUR <span class="accent">STORY</span></h2>
  <p>Tell us about your project. We'll get back within 24 hours.</p>
  <div class="contact-links">
    <a href="mailto:hello@bemonixagency.co">hello@bemonixagency.co</a>
    <a href="#">Book a Call</a>
  </div>
</section>

<footer>© 2026 BEMONIX · HOUSTON, TX · REMOTE WORLDWIDE</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ── MOBILE NAV TOGGLE ────────────────────────────────────────────────────────
// Hamburger just toggles a class on <nav> — the CSS at max-width:900px reuses
// the SAME <ul> as the mobile dropdown panel, no duplicate markup involved.
(function initNavToggle() {
  const nav = document.querySelector('nav');
  const toggle = document.getElementById('navToggle');
  if (!nav || !toggle) return;
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('nav-open');
    toggle.setAttribute('aria-expanded', open);
  });
  nav.querySelectorAll('ul a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('nav-open');
    toggle.setAttribute('aria-expanded', 'false');
  }));
})();

gsap.from('.contact h2',{y:50, opacity:0, duration:1, delay:.2});
gsap.from('.contact p, .contact-links a', {y:20, opacity:0, stagger:.12, duration:.6, delay:.6});
</script>
</body>
</html>
