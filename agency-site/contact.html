<!--
  BEMONIX — Contact page (contact.html)
  =======================================
  One section: closing CTA with two direct contact links. No scroll-driven
  effects here beyond a simple entrance animation (see <script> below).

  Part of a multi-page site: index.html (hero landing page) / showcase.html
  (full 44-template work grid) / featured.html / about.html / services.html
  / contact.html (this page). All six share the same nav, footer, and
  5-variable color system defined in :root below — see index.html's file
  header for the full explanation of what each variable controls. Keep the
  :root line identical across all six files if you change the palette.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEMONIX — Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Inter:wght@200;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#761941;--bg:#fff7e2;--surface:#ffffff;--muted:rgba(76,16,42,.55);--text:#4c102a;--gold:#c9a227}
/* html/body locked to exactly one viewport tall (no scroll) — this page is
   a single section + footer meant to fit entirely on screen. .contact
   below flexes to fill whatever's left after the footer's natural height. */
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column}

nav{position:fixed;top:0;width:100%;height:90px;padding:0 3rem;display:flex;justify-content:space-between;align-items:center;z-index:200;background:rgba(255,247,226,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--surface)}
nav .logo{display:block;height:150px;width:auto;flex-shrink:0}
nav > ul{display:flex;align-items:center;gap:2.5rem;list-style:none}
nav a{color:var(--text);text-decoration:none;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
nav .nav-cta{padding:.5rem 1.5rem;border:1px solid rgba(76,16,42,.3);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--text);transition:border-color .3s,color .3s}
nav .nav-cta:hover{background:var(--accent);border-color:var(--gold);color:var(--gold)}
/* "Work" nav dropdown — .nav-dropdown is given the nav's own 90px height so
   its hover area spans down to exactly where the menu appears (top:100%),
   with no gap a slow-moving cursor could fall through and drop the :hover. */
nav .nav-dropdown{position:relative;display:flex;align-items:center;height:90px}
nav .nav-dropdown > a::after{content:'';display:inline-block;margin-left:.4em;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;vertical-align:middle;opacity:.6}
nav .nav-dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-6px);display:flex;flex-direction:column;gap:.15rem;min-width:170px;list-style:none;background:rgba(255,247,226,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--surface);border-radius:.6rem;padding:.5rem;box-shadow:0 20px 45px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
nav .nav-dropdown:hover .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
nav .nav-dropdown-menu a{display:block;padding:.65rem .9rem;border-radius:.35rem;white-space:nowrap}
nav .nav-dropdown-menu a:hover{background:rgba(201,162,39,.1);color:var(--gold)}

/* CONTACT — dark section, same treatment as Featured/Services (see the
   "Alternating section backgrounds" comment in index.html's file header)
   with locally-redefined --surface/--text/--muted/--accent custom
   properties for this subtree. */
.contact{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px 3rem 1.5rem;background:#761941;--surface:rgba(255,247,226,.25);--text:#fff7e2;--muted:rgba(255,247,226,.65);--accent:#ffe9af} /* top padding clears the fixed nav — see the matching comment on featured.html's .h-section for why it's 140px, not just the nav's own 90px. flex:1/min-height:0 (instead of min-height:100vh) makes this fill whatever's left of the viewport after the footer, so the page fits on one screen with no scroll */
.contact h2{font-family:'Jost',sans-serif;font-weight:600;font-size:clamp(2.4rem,min(8vw,13vh),6rem);letter-spacing:.05em;color:var(--text)} /* capped by vh as well as vw — a pure vw cap can still be too tall for a short window on this no-scroll page */
.contact h2 .accent{color:var(--accent)}
.contact p{color:var(--muted);font-size:.85rem;margin-top:1.2rem;font-weight:200}
.contact-links{display:flex;gap:2rem;justify-content:center;margin-top:2rem}
.contact-links a{color:var(--text);text-decoration:none;font-size:.75rem;letter-spacing:.2em;border-bottom:1px solid var(--surface);padding-bottom:.3rem;transition:border-color .3s,color .3s}
.contact-links a:hover{border-color:var(--gold);color:var(--gold)}

footer{padding:1.2rem 3rem;border-top:1px solid var(--surface);text-align:center;font-size:.6rem;color:var(--muted);letter-spacing:.2em;flex-shrink:0}
</style>
</head>
<body>

<nav>
  <a href="index.html"><img class="logo" src="../Screenshots/bemonix-logo-transparent.png" alt="Bemonix"></a>
  <ul>
    <li class="nav-dropdown">
      <a href="showcase.html">Work</a>
      <ul class="nav-dropdown-menu">
        <li><a href="featured.html">Featured Work</a></li>
        <li><a href="showcase.html">All Work</a></li>
      </ul>
    </li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <a href="contact.html" class="nav-cta">Start a Project</a>
</nav>

<section class="contact" id="contact">
  <h2>LET'S TELL<br>YOUR <span class="accent">STORY</span></h2>
  <p>Tell us about your project. We'll get back within 24 hours.</p>
  <div class="contact-links">
    <a href="mailto:hello@bemonixagency.co">hello@bemonixagency.co</a>
    <a href="#">Book a Call</a>
  </div>
</section>

<footer>© 2026 BEMONIX · HOUSTON, TX · REMOTE WORLDWIDE</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
gsap.from('.contact h2',{y:50, opacity:0, duration:1, delay:.2});
gsap.from('.contact p, .contact-links a', {y:20, opacity:0, stagger:.12, duration:.6, delay:.6});
</script>
</body>
</html>
