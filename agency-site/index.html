<!--
  BEMONIX — landing page (index.html)
  =========================================
  Single-file static site: all CSS lives in the <style> block below, all
  behavior in the <script> block at the bottom of <body>. No build step,
  no framework — just GSAP (loaded from CDN) for animation.

  This page is hero-only: nav + full-screen 3D "corridor" of drifting
  template screenshots (pure CSS keyframes generated by JS, see buildKF()
  below) + footer.

  Part of a multi-page site: index.html (this page) / showcase.html (full
  44-template work grid) / featured.html ("What We Build" hover reveal) /
  about.html / services.html / contact.html. All six share the same nav,
  footer, and 5-variable color system defined in :root below.

  COLOR SYSTEM — change the whole site's palette by editing ONLY the five
  CSS custom properties in :root below. Every other color in this file is
  either `var(--accent|bg|surface|muted|text)` or an `rgba()` restating
  one of those hex values with transparency (since CSS can't apply alpha
  to a var() color directly). If you change a hex below, search the file
  for its rgb() equivalent and update those rgba(...) values too, or the
  translucent overlays (nav blur, hero vignette, etc.) will drift out of
  sync with the solid colors. Keep this :root identical across all six
  pages if you change the palette.
    --accent : highlight color — active states, links, small headings
    --bg     : page background
    --surface: card/panel background, hairline borders
    --muted  : secondary/body text (kept as an rgba() so it reads at
               partial opacity against either --bg or --surface)
    --text   : primary text color
  Current values are sampled directly from the Bemonix logo file
  (../Screenshots/235793839.png): background #fff7e2, ink #4c102a.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEMONIX — Web Design Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Inter:wght@200;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* See the file-header comment above for what each variable controls. */
:root{--accent:#761941;--bg:#fff7e2;--surface:#ffffff;--muted:rgba(76,16,42,.55);--text:#4c102a;--gold:#c9a227} /* --gold is deliberately NOT overridden by the dark sections' local --accent/--surface/etc. redefinitions (see featured.html/services.html/contact.html) — it's one constant hover/highlight color used the same way everywhere, light or dark background, unlike --accent which flips per section */
/* html/body locked to exactly one viewport tall (no scroll) — this page is
   the hero section + footer meant to fit entirely on screen, same as the
   other five pages. .hero below flexes to fill whatever's left after the
   footer's natural height. */
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column}

/* Fixed header. Frosted-glass background (blur) so it stays legible over
   whatever scrolls underneath it — swap the logo file via nav .logo img
   src in the HTML, not here. */
nav{position:fixed;top:0;width:100%;height:90px;padding:0 3rem;display:flex;justify-content:space-between;align-items:center;z-index:200;background:rgba(255,247,226,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--surface)} /* height is fixed on purpose — the logo is taller than the bar and is allowed to overflow it (see nav .logo below) rather than stretching the bar to match */
nav .logo{display:block;height:150px;width:auto;flex-shrink:0} /* logo <img> height — intentionally bigger than nav's own height, so it overflows the bar instead of growing it */
nav > ul{display:flex;align-items:center;gap:2.5rem;list-style:none}
nav a{color:var(--text);text-decoration:none;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
nav .nav-cta{padding:.5rem 1.5rem;border:1px solid rgba(76,16,42,.3);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--text);transition:border-color .3s,color .3s}
nav .nav-cta:hover{background:var(--accent);border-color:var(--gold);color:var(--gold)}
/* "Work" nav dropdown — .nav-dropdown is given the nav's own 90px height so
   its hover area spans down to exactly where the menu appears (top:100%),
   with no gap a slow-moving cursor could fall through and drop the :hover. */
nav .nav-dropdown{position:relative;display:flex;align-items:center;height:90px}
nav .nav-dropdown > a::after{content:'';display:inline-block;margin-left:.4em;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;vertical-align:middle;opacity:.6}
nav .nav-dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-6px);display:flex;flex-direction:column;gap:.15rem;min-width:170px;list-style:none;background:rgba(255,247,226,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--surface);border-radius:.6rem;padding:.5rem;box-shadow:0 20px 45px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
nav .nav-dropdown:hover .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
nav .nav-dropdown-menu a{display:block;padding:.65rem .9rem;border-radius:.35rem;white-space:nowrap}
nav .nav-dropdown-menu a:hover{background:rgba(201,162,39,.1);color:var(--gold)}

/* NAV — RESPONSIVE. Three tiers, from the widest down:
     >1150px       desktop — the rules above, untouched.
     901-1150px    "smaller monitors": same full inline layout, just
                   shrunk (tighter gaps/type/logo) — there's still room
                   for the whole menu, it's just tight.
     <=900px       tablets and phones: nav > ul collapses behind the
                   hamburger toggle below; .nav-cta stays visible next to
                   it since it's the primary action.
   The hamburger doesn't duplicate any markup — .nav-open (toggled on
   <nav> by the JS at the bottom of <body>) just re-shows/restyles the
   SAME <ul> as a full-width dropdown panel, and the "Work" submenu
   becomes permanently inline there instead of hover-triggered, since
   touch has no hover. .nav-actions wraps .nav-cta + the toggle together
   so they sit as one group on the right once <ul> stops taking up space
   in the middle — see the HTML. */
.nav-actions{display:flex;align-items:center;gap:1rem}
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.nav-toggle span{display:block;width:100%;height:2px;background:var(--text);transition:transform .3s,opacity .3s}
nav.nav-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
nav.nav-open .nav-toggle span:nth-child(2){opacity:0}
nav.nav-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

@media(max-width:1150px) and (min-width:901px){
  nav{padding:0 1.75rem}
  nav .logo{height:110px}
  nav > ul{gap:1.5rem}
  nav a{font-size:.62rem}
  nav .nav-cta{padding:.4rem 1.1rem;font-size:.6rem}
}

@media(max-width:900px){
  nav{padding:0 1.5rem}
  nav .logo{height:100px}
  .nav-toggle{display:flex}
  nav > ul{display:none;position:absolute;top:90px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:rgba(255,247,226,.98);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--surface);padding:.5rem 1.5rem 1.5rem;box-shadow:0 20px 40px rgba(0,0,0,.15);max-height:calc(100vh - 90px);overflow-y:auto}
  nav.nav-open > ul{display:flex}
  nav > ul > li{width:100%}
  nav > ul > li > a{display:block;padding:.9rem 0;border-bottom:1px solid rgba(76,16,42,.08)}
  nav .nav-dropdown{height:auto;display:block;position:static}
  nav .nav-dropdown > a::after{display:none}
  nav .nav-dropdown-menu{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:none;padding:0 0 .5rem 1rem;gap:0;min-width:0}
  nav .nav-dropdown-menu a{padding:.7rem 0;border-bottom:none;font-size:.65rem;color:var(--muted)}
  nav .nav-cta{padding:.45rem 1rem;font-size:.6rem}
}

/* MOBILE — this page is normally locked to exactly one screen with no
   scroll (see html,body above); on a short/narrow phone viewport that
   means either illegible tiny text or clipped content, so below this
   breakpoint the constraint is dropped entirely and the hero just
   becomes a normal, natural-height, scrollable section instead. */
@media(max-width:640px){
  html,body{height:auto;overflow:visible}
  .hero{flex:none;min-height:100vh;min-height:100dvh}
  .hero-content{height:auto;min-height:100vh;min-height:100dvh;padding:7rem 1.25rem 3rem}
  .hero-content h1{white-space:normal;font-size:clamp(1.7rem,8vw,2.6rem);line-height:1.2} /* white-space was nowrap on desktop — at phone widths the full headline can't fit on one line at any legible size, so it needs to be allowed to wrap here */
  .hero-cta{flex-wrap:wrap;justify-content:center}
}

/* HERO — 3D "corridor" carousel.
   The actual cards (.corridor-card) are created and animated entirely by
   JS at the bottom of the file (see the "CORRIDOR" section of <script>):
   it builds two @keyframes animations (one per direction) from the P{}
   physics object, then spawns N absolutely-positioned cards per rail and
   lets CSS animation loop them along those keyframes forever. Editing
   the carousel's speed/size/depth is done in JS (the P object), not here. */
.hero{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;container-type:inline-size} /* flex:1/min-height:0 (instead of a flat height:100vh) makes this fill whatever's left of the viewport after the footer, so the page fits on one screen with no scroll — see the matching pattern on the other five pages */
.corridor-wrap{position:absolute;inset:0;pointer-events:none;z-index:2}
.corridor-3d{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none} /* perspective/perspective-origin set inline by JS */
.corridor-card{position:absolute;overflow:hidden;backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--accent);box-shadow:0 15px 35px rgba(0,0,0,.25)} /* thin outline + soft shadow so each card reads as a distinct framed tile against the cream background, rather than just a floating screenshot — border uses var(--accent), the site's burgundy, so it stays in sync if the palette changes */
.corridor-card img{width:100%;height:100%;object-fit:cover;object-position:center;display:block} /* cover, not contain — individual screenshots vary slightly in their real aspect ratio (~2.17-2.21) around the card's own ratio (2.19), so "contain" left a thin letterbox gap (showing the card's white background) on some images between the image and the border. "cover" guarantees zero gap at the cost of ~1% cropped off one edge on the most mismatched images — imperceptible in practice */
.corridor-logo{position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);width:clamp(120px,13vw,220px);height:auto;opacity:.55;z-index:1;pointer-events:none} /* dimmed cube-icon watermark, always "on" at a constant opacity — it only APPEARS to switch on/off because .corridor-wrap (the cards) sits at a higher z-index (2 vs this element's 1) and .corridor-card has an opaque background, so any card sitting over this spot fully covers the logo; no JS/opacity animation needed, it's pure natural occlusion */
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center 55%,rgba(255,247,226,0) 60%,rgba(255,247,226,.22) 100%);z-index:2;pointer-events:none} /* vignette so the corridor cards don't fight with the hero text; keep this subtle or the cards wash out */
.hero-content{position:relative;z-index:3;text-align:center;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:7rem 2rem .35rem} /* top padding must clear the fixed nav's own 90px height — re-check if you resize `nav`'s `height`, not the logo. bottom padding kept small on purpose so the tagline/CTA cluster sits low, clear of the corridor cards' more central vertical range instead of drifting up into it — nudged a few px lower still since the tagline could still catch a large exiting corridor card at some window heights */
.hero-content h1{font-family:'Jost',sans-serif;font-weight:600;font-size:clamp(1.8rem,4.2vw,3.8rem);line-height:1;letter-spacing:.08em;white-space:nowrap;opacity:0} /* pre-hidden here (not just via gsap.from) so there's no flash-of-visible-content before the entrance script below runs */
.hero-content h1 .accent{color:var(--accent)}
.hero-content p{font-size:.9rem;color:rgba(76,16,42,.75);letter-spacing:.2em;text-transform:uppercase;font-weight:200;opacity:0}
.hero-bar{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);width:200px;margin:.8rem auto 0;transform:scaleX(0)}
.hero-cta{display:flex;gap:1.2rem;justify-content:center;margin-top:2rem}
.hero-cta a{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:.9rem 2rem;border-radius:2px;transition:all .3s;opacity:0}
.hero-cta .btn-primary{background:var(--accent);color:var(--bg);border:1px solid var(--accent)}
.hero-cta .btn-primary:hover{background:var(--accent);border-color:var(--gold);color:var(--gold)}
.hero-cta .btn-secondary{color:var(--text);border:1px solid rgba(76,16,42,.3)}
.hero-cta .btn-secondary:hover{background:var(--accent);border-color:var(--gold);color:var(--gold)}

footer{padding:1.2rem 3rem;border-top:1px solid var(--surface);text-align:center;font-size:.6rem;color:var(--muted);letter-spacing:.2em;flex-shrink:0}
</style>
</head>
<body>

<nav>
  <a href="index.html"><img class="logo" src="../Screenshots/bemonix-logo-transparent.png" alt="Bemonix"></a>
  <ul>
    <li class="nav-dropdown">
      <a href="showcase.html">Work</a>
      <ul class="nav-dropdown-menu">
        <li><a href="featured.html">Featured Work</a></li>
        <li><a href="showcase.html">All Work</a></li>
      </ul>
    </li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <a href="contact.html" class="nav-cta">Start a Project</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="hero">
  <div class="corridor-wrap" id="corridorWrap">
    <div class="corridor-3d" id="corridor3d"></div>
  </div>
  <img class="corridor-logo" src="../Screenshots/cube-logo-upscaled-transparent.png" alt="Bemonix">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1><span class="accent">Digital</span> Solutions<span class="accent"> Built to</span> Perform</h1>
    <div class="hero-bottom">
      <p>Every website you see here was built by us and yours can be next</p>
      <div class="hero-bar"></div>
      <div class="hero-cta">
        <a href="contact.html" class="btn-primary">Start a Project</a>
        <a href="showcase.html" class="btn-secondary">View Our Work</a>
      </div>
    </div>
  </div>
</section>

<footer>© 2026 BEMONIX · HOUSTON, TX · REMOTE WORLDWIDE</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ── MOBILE NAV TOGGLE ────────────────────────────────────────────────────────
// Hamburger just toggles a class on <nav> — the CSS at max-width:900px reuses
// the SAME <ul> as the mobile dropdown panel, no duplicate markup involved.
(function initNavToggle() {
  const nav = document.querySelector('nav');
  const toggle = document.getElementById('navToggle');
  if (!nav || !toggle) return;
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('nav-open');
    toggle.setAttribute('aria-expanded', open);
  });
  nav.querySelectorAll('ul a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('nav-open');
    toggle.setAttribute('aria-expanded', 'false');
  }));
})();

// ── CORRIDOR ──────────────────────────────────────────────────────────────────
// The hero background is two rails of cards that appear to fly toward the
// viewer out of a vanishing point and peel off to either side. It's done
// entirely with a generated CSS @keyframes animation (see buildKF below) —
// no per-frame JS — so tune the whole effect by editing these numbers:
const P = {
  perspective:60,             // CSS perspective distance, in cqw (container query width units)
  cardWidth:58, cardHeight:26.5, cardRadius:.4,  // resting size/radius of each card, in cqw — keep the width:height ratio close to 2.19 (real screenshots are 1918x876) or they'll look stretched
  birthHeight:14, exitHeight:30,  // apparent on-screen height (cqw) of a card when it spawns vs. when it exits — these drive the z-depth math in buildKF, not literal CSS sizes
  railBirth:4, railExit:58,   // how far a card sits from center (cqw) at birth vs. exit — i.e. how wide the "V" the two rails fly apart into
  fan:2.4,                    // exponent controlling how quickly a card accelerates outward along the rail (higher = stays centered longer, then flares out fast). Lowered from the original 3.3 so cards start drifting outward from their very first frame instead of sitting near-center for a while and then flaring — softens the motion without touching opacity
  turnBirth:6, turnExit:28,   // rotateY angle (degrees) at birth vs. exit, so cards turn to face outward as they leave
  stops:24                    // number of keyframe steps generated — more = smoother animation, more CSS
};

const IMAGES = [
  '../Screenshots/voxel.png',
  '../Screenshots/atelier.png',
  '../Screenshots/pulse.png',
  '../Screenshots/resonance.png',
  '../Screenshots/kael.png',
  '../Screenshots/nexus.png',
  '../Screenshots/haven.png',
  '../Screenshots/aether.jpg',
  '../Screenshots/monolith.png',
  '../Screenshots/void.png',
  '../Screenshots/zephyr.png',
  '../Screenshots/blvk.png',
  '../Screenshots/forge.png',
  '../Screenshots/ember.png',
  '../Screenshots/drift.png',
  '../Screenshots/celestia.png',
  '../Screenshots/canvas.png',
  '../Screenshots/thread.png',
  '../Screenshots/nova.png',
  '../Screenshots/lumen.png',
  '../Screenshots/haus.png',
  '../Screenshots/relic.png',
  '../Screenshots/grind.png',
  '../Screenshots/kiln.png',
  '../Screenshots/saffron.png',
  '../Screenshots/sterling.png',
  '../Screenshots/domaine.png',
  '../Screenshots/crumb.png',
  '../Screenshots/asana.png',
  '../Screenshots/wanderlog.png',
  '../Screenshots/raw.png',
  '../Screenshots/splice.png',
  '../Screenshots/Form.png',
  '../Screenshots/margot.png',
  '../Screenshots/pawsome.png',
  '../Screenshots/sparks.png',
  '../Screenshots/sage.png',
  '../Screenshots/clarity.png',
  '../Screenshots/pixel forge.png',
  '../Screenshots/noir.png',
  '../Screenshots/summit.png',
  '../Screenshots/quantum.png',
  '../Screenshots/iron elite.png',
  '../Screenshots/titan forge.png'
];

// Builds one @keyframes rule (as a CSS string) covering a card's whole
// birth-to-exit journey, sampled at P.stops points (u goes 0 -> 1).
// `dir` is +1 or -1 (which of the two rails this is for — they're mirror
// images of each other, moving to opposite sides).
//
// The core trick: `scale` isn't applied as a CSS scale() transform. Instead
// it's used to solve for how far along the z-axis (toward/away from the
// camera) the card must sit so that, once CSS's perspective projection
// happens, the card's PROJECTED on-screen size equals birthHeight at u=0
// and exitHeight at u=1. That's the standard "true size at distance d
// under perspective p" formula solved for z: z = p * (1 - 1/scale).
// This is why resizing the actual card (P.cardWidth/cardHeight in the CSS)
// doesn't change how big it looks at birth/exit — only birthHeight/
// exitHeight control that; cardWidth/cardHeight only affect the card's
// aspect ratio and how much it overshoots that apparent size in between.
function buildKF(dir, name) {
  const steps = [];
  for (let s = 0; s <= P.stops; s++) {
    const u = s / P.stops;
    const scale = (P.birthHeight / P.cardHeight) * Math.pow(P.exitHeight / P.birthHeight, u);
    const z = P.perspective * (1 - 1 / scale);
    const rail = P.railExit - (P.railExit - P.railBirth) * Math.pow(1 - u, P.fan); // eased outward drift, see P.fan
    const turn = P.turnBirth + (P.turnExit - P.turnBirth) * u; // linear rotateY ramp
    // fully opaque the entire time, only fade out over the last 20% (exit).
    // Deliberately NOT fading in at birth (u near 0) even though that
    // reads a little more "sudden" — the cards must be fully opaque while
    // they're near center/still separating, or they partially reveal the
    // .corridor-logo sitting behind them (see that element's comment)
    // instead of fully occluding it, which looks like broken transparency.
    const opacity = u > 0.80 ? 1 - (u - 0.80) / 0.20 : 1;
    steps.push(`${(u*100).toFixed(2)}%{transform:translate3d(${(dir*rail).toFixed(2)}cqw,0,${z.toFixed(2)}cqw) rotateY(${(-dir*turn).toFixed(2)}deg);opacity:${opacity.toFixed(3)}}`);
  }
  return `@keyframes ${name}{${steps.join('')}}`;
}

// Injects the two generated @keyframes rules, then spawns the actual card
// elements and lets plain CSS `animation` loop them along those keyframes
// forever (staggered via negative animation-delay so they don't all move
// in lockstep). Nothing here runs per-frame — the browser's own CSS
// animation engine does all the work after this one-time setup.
(function initCorridor() {
  const CARDS = 2,   // cards per rail (× 2 rails = total cards on screen)
        SPEED = 22,  // seconds for one full birth-to-exit loop
        AXIS = 58;   // vertical anchor point for the rails, as % of .hero height
  const style = document.createElement('style');
  style.textContent = buildKF(1,'cr') + buildKF(-1,'cl') +
    '@media(prefers-reduced-motion:reduce){.cc{animation-play-state:paused}}';
  document.head.appendChild(style);

  const wrap = document.getElementById('corridorWrap');
  const stage = document.getElementById('corridor3d');
  wrap.style.perspective = `${P.perspective}cqw`;
  wrap.style.perspectiveOrigin = `50% 58%`;

  const shuffled = [...IMAGES].sort(() => Math.random() - 0.5);
  const half = Math.ceil(shuffled.length / 2);
  const railImages = [shuffled.slice(0, half), shuffled.slice(half)];

  ['cr','cl'].forEach((anim, ri) => {
    const imgs = railImages[ri];
    for (let i = 0; i < CARDS; i++) {
      const card = document.createElement('div');
      card.className = 'corridor-card cc';
      Object.assign(card.style, {
        position:'absolute', left:'50%', top:`${AXIS}%`,
        width:`${P.cardWidth}cqw`, height:`${P.cardHeight}cqw`,
        marginLeft:`${-P.cardWidth/2}cqw`, marginTop:`${-P.cardHeight/2}cqw`,
        borderRadius:`${P.cardRadius}cqw`, overflow:'hidden',
        backfaceVisibility:'hidden',
        animation:`${anim} ${SPEED}s linear infinite`,
        animationDelay:`${-(i*SPEED)/CARDS}s`
      });
      const img = document.createElement('img');
      img.src = imgs[i % imgs.length];
      img.alt = '';
      img.loading = 'lazy';
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:center;display:block'; // cover, not contain — see the .corridor-card img CSS comment; this inline style is what actually applies at runtime and overrides that rule, so it has to match
      img.draggable = false;
      card.appendChild(img);
      stage.appendChild(card);
    }
  });
})();

// ── HERO ENTRANCE ─────────────────────────────────────────────────────────────
// fromTo (not from) throughout: h1/p/hero-bar/hero-cta a all start hidden via
// plain CSS (opacity:0 / scaleX(0)) so there's no flash-of-visible-content
// before this script runs. gsap.from() alone would be wrong here — it reads
// the element's CURRENT style as its animation target, and since that
// current style is already the hidden CSS state, a .from() would just
// animate from hidden to hidden (invisible the whole time). fromTo pins the
// visible end state explicitly, independent of whatever the CSS starts at.
gsap.fromTo('.hero-content h1', {y:60, opacity:0}, {y:0, opacity:1, duration:1.5, delay:.4, ease:'power3.out'});
gsap.fromTo('.hero-content p',  {y:20, opacity:0}, {y:0, opacity:1, duration:.8,  delay:1});
gsap.fromTo('.hero-bar',        {scaleX:0},        {scaleX:1, duration:1, delay:1.3});
gsap.fromTo('.hero-cta a',      {y:20, opacity:0}, {y:0, opacity:1, stagger:.12, duration:.7, delay:1.6});
// .corridor-logo needs no JS at all — it's a constant-opacity element that
// only ever *appears* to switch on/off because the opaque cards above it
// (higher z-index, see the CSS comment on .corridor-logo) physically cover
// it whenever one sits at that screen position, and uncover it the moment
// they've moved apart. No animation, no timing math, no drift.
</script>
</body>
